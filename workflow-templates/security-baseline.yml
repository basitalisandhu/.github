# Starter workflow: security baseline for repositories under basitalisandhu.
# Calls the reusable workflow in basitalisandhu/.github so every repo runs the
# same checks: CodeQL, gitleaks, dependency review and OpenSSF Scorecard.

name: Security baseline

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    uses: basitalisandhu/.github/.github/workflows/reusable-security.yml@main
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
      pull-requests: write
    secrets: inherit
    # Optional overrides:
    # with:
    #   codeql-languages: javascript-typescript,python
    #   dependency-fail-on-severity: moderate
