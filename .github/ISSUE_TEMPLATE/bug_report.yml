name: Bug report
description: Something does not work as documented
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security vulnerability, stop here and follow SECURITY.md instead of filing a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, package version or commit SHA
      placeholder: v0.3.1 or a1b2c3d
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands, config or code. Remove any secrets.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Relevant logs, stack traces or audit entries. Redact tokens and personal data.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, runtime version (Node, Python), agent framework if relevant
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true
