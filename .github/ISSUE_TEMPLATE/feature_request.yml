name: Feature request
description: Propose a change or an addition
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketches, config examples and API shapes are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fit less well.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Policy / authorization
        - Credentials / broker
        - Audit / evidence
        - Dataset / taxonomy
        - Rules / static analysis
        - Threat modelling
        - Docs
        - CI / tooling
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
